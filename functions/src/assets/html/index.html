  <body>
    <!-- __DATA__ -->
    <div class="card">
      <img class="thumbnail" id="thumbnail">
      <img class="app-icon" id="appIcon">
      <div class="text-block">
        <span class="app-name" id="appName"></span>
        <span class="app-description" id="appDescription"></span>
        <span class="link-title" id="linkTitle"></span>
      </div>
      <p class="link-description" id="linkDescription"></p>
      <div id="checkboxDiv">
        <input id="clipboardCheckbox" type="checkbox" checked="">
        <label id="clipboardLabel" for="clipboardCheckbox"></label>
      </div>
      <div id="redirectMessage"></div>
      <div id="mobileButton">
        <div id="installLink"></div>
      </div>
      <div class="desktop-only" id="storeButtons">
        <p id="downloadAppText"></p>
        <div class="store-buttons-row">
          <img id="playStoreButton" class="store-button" src="" alt="">
          <img id="appStoreButton" class="store-button" src="" alt="">
        </div>
      </div>
    </div>
  </body>

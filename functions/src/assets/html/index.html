<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />
    <link rel="icon" type="image/png" href="" />
    <link rel="mask-icon" href="" color="#ffffff" />
    <link rel="apple-touch-icon" href="" />

    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{thumbnail}}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #fafafa;
      }
    
      div > div > div {
        text-align: center;
        padding: 20px;
      }
    
      img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        margin-bottom: 16px;
        border-radius: 12px; /* 🔵 Rounded corners for the app icon */
      }
    
      span:first-of-type {
        display: block;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #202124;
      }
    
      span:last-of-type {
        display: block;
        font-size: 14px;
        color: #5f6368;
        margin-bottom: 24px;
        overflow: hidden;
        display: -webkit-box;
        line-clamp: 10;
        -webkit-line-clamp: 10;
        -webkit-box-orient: vertical;
      }
    
      /* 🔵 Group checkbox + label inline */
      #clipboardCheckbox {
        margin-right: 8px;
        vertical-align: middle;
      }
    
      label {
        font-size: 12px;
        color: #5f6368;
        display: inline-block;
        vertical-align: middle;
        margin-bottom: 24px;
        text-align: left;
      }
    
      #installLink {
        background-color: #1a73e8;
        color: white;
        padding: 12px 24px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
        display: inline-block;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: background-color 0.2s;
      }

      #installLink:hover {
        background-color: #1765c1;
      }

      #checkboxDiv {
        display: flex;
        gap: 8px;
        justify-content: center;
        font-size: 12px;
        color: #5f6368;
        margin-bottom: 24px;
        text-align: left;
      }

      #storeButtons {
        display: none;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .store-button {
        cursor: pointer;
        transition: opacity 0.2s;
        height: 60px;
        width: auto;
      }

      .store-button:hover {
        opacity: 0.8;
      }

      .desktop-only {
        display: none;
      }

      #redirectMessage {
        display: none;
        font-size: 14px;
        color: #5f6368;
        margin-bottom: 16px;
        text-align: center;
      }

    </style>
    
  </head>

  <body>
    <div>
      <div>
        <div>
          <span>
            <img src="{{app_icon}}" aria-hidden="true" role="none">
            <br/>
            {{app_name}}
          </span>
          <span>
            {{app_description}}
          </span>
        </div>
        <div>
          <div id="checkboxDiv">
            <input id="clipboardCheckbox" type="checkbox" checked="">
            <label for="clipboardCheckbox">
              Save my place in the app. A link will be copied to continue to this page.
            </label>
          </div>
          <div id="redirectMessage">
            You're being redirected... Tap OPEN if this fails
          </div>
          <div id="mobileButton">
            <div id="installLink">
            OPEN
            </div>
          </div>
          <div class="desktop-only" id="storeButtons">
            <p style="color: #5f6368; font-size: 14px; margin-bottom: 8px;">Download the app:</p>
            <img id="appStoreButton" class="store-button" src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&releaseDate=1234567890" alt="Download on the App Store">
            <img id="playStoreButton" class="store-button" src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
          </div>
        </div>
      </div>
    </div>
  </body>

  <script type="module">

    function copyToClipboard(urlWithHeuristics) {
      const input = document.createElement('input');
      input.value = urlWithHeuristics;
      input.style.position = 'fixed';
      input.style.opacity = '0.0001';
      document.body.appendChild(input);
      input.focus();
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
    }

    function generateURLWithHeuristics(heuristics) {
      const url = new URL(window.location.href);
      url.searchParams.set('_lang', heuristics.language);
      url.searchParams.set('_langs', heuristics.languages);
      url.searchParams.set('_tz', heuristics.timezone);
      url.searchParams.set('_res', `${heuristics.screenWidth}x${heuristics.screenHeight}`);
      url.searchParams.set('_dpr', heuristics.devicePixelRatio);
      url.searchParams.set('_plt', heuristics.platform);
      // url.searchParams.set('_ua', heuristics.userAgent);
      return url.toString()
    }

    const heuristics = {
      language: navigator.language || null,
      languages: navigator.languages || null,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
      screenWidth: window.screen.width,
      screenHeight: window.screen.height,
      devicePixelRatio: window.devicePixelRatio || null,
      platform: navigator.platform || null,
      userAgent: navigator.userAgent || null,
      connectionType: navigator.connection?.effectiveType || null,
      hardwareConcurrency: navigator.hardwareConcurrency || null,
      memory: navigator.deviceMemory || null,
      colorDepth: window.screen.colorDepth || null
    };

    const urlWithHeuristics = generateURLWithHeuristics(heuristics);
    // document.getElementById("installLink").href = urlWithHeuristics;
    const heuristicsWithClipboard = {
      ...heuristics,
      clipboard: urlWithHeuristics
    };

    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isDesktop = !isIOS && !isAndroid;

    // Check if we have a link parameter
    const currentURL = new URL(window.location.href);
    const originalLinkParam = currentURL.searchParams.get("link");

    // Show appropriate buttons based on platform
    if (isDesktop) {
      // For desktop, show OPEN button if there's a link to redirect to
      if (originalLinkParam) {
        // Keep the OPEN button visible for desktop
        document.getElementById('checkboxDiv').style.display = 'none';
        // Show redirect message immediately
        document.getElementById('redirectMessage').style.display = 'block';
      } else {
        // Only show store buttons if there's NO link to redirect to
        document.getElementById('mobileButton').style.display = 'none';
        document.getElementById('checkboxDiv').style.display = 'none';
        document.getElementById('storeButtons').style.display = 'flex';
      }
    }

    async function handleRedirect() {
      // example: http://127.0.0.1:5002/xxx?_lang=en-US&_langs=en-US&_tz=Europe%2FMadrid&_res=1710x1107&_dpr=2&_plt=MacIntel

      const currentURL = new URL(window.location.href);
      const originalLinkParam = currentURL.searchParams.get("link");

      // Don't redirect if there's no link parameter
      if (!originalLinkParam) {
        console.log('No link parameter found - staying on page');
        return;
      }

      const checkbox = document.getElementById("clipboardCheckbox");
      if (checkbox?.checked) {
        copyToClipboard(urlWithHeuristics);
      }

      await fetch('/v1_preinstall_save_link', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(heuristicsWithClipboard)
      });

      // Create filtered URL with only 'link' param for referrer
      const filteredURL = new URL(currentURL.origin + currentURL.pathname);
      if (originalLinkParam) {
        filteredURL.searchParams.set("link", originalLinkParam);
      }

      //  This followLink behaviour was meant when no app wants to e opened, kept
      //   so in the future we want this behaviour
      // if ('{{followLink}}' !== '' && '{{followLink}}' !== 'about:blank') {
      //   window.location.replace('{{followLink}}');
      // } else
      if (isIOS) {
        window.location.href = 'https://apps.apple.com/us/app/{{appStoreID}}';
      } else if (isAndroid) {
        if ('{{androidScheme}}' != '') {
          const fallbackUrl = encodeURIComponent(
            'https://play.google.com/store/apps/details?id={{androidBundleID}}',
          );
          window.location.href = `intent:#Intent;scheme={{androidScheme}};package={{androidBundleID}};S.browser_fallback_url=${fallbackUrl};end`;
        } else {
          // Add UTM parameters to filteredURL
          const utmParams = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
          utmParams.forEach(param => {
            const value = currentURL.searchParams.get(param);
            if (value) {
              filteredURL.searchParams.set(param, value);
            }
          });

          const playStoreLocation =
            'https://play.google.com/store/apps/details?id={{androidBundleID}}&referrer=' +
            encodeURIComponent(filteredURL.toString());
          window.location.href = playStoreLocation;
        }
      } else {
        console.log('Not iOs or android detected - redirecting to destination')
        // Use location.replace() instead of location.href to preserve referrer
        window.location.replace(originalLinkParam);
      }
    }

    // Setup event listeners based on platform
    if (isDesktop) {
      if (originalLinkParam) {
        // Show OPEN button and set up auto-redirect after delay
        const installLink = document.getElementById("installLink");

        // Add click handler for manual redirect
        installLink.addEventListener("click", handleRedirect);

        // Auto-redirect after 1.5 seconds to give GA4 time to track the page view
        setTimeout(() => {
          handleRedirect();
        }, 1500);
      } else {
        // Show store buttons for desktop users (no link to redirect to)
        document.getElementById("appStoreButton").addEventListener("click", () => {
          window.location.href = 'https://apps.apple.com/us/app/{{appStoreID}}';
        });

        document.getElementById("playStoreButton").addEventListener("click", () => {
          window.location.href = 'https://play.google.com/store/apps/details?id={{androidBundleID}}';
        });
      }
    } else {
      // Wait for user click on mobile
      document.getElementById("installLink").addEventListener("click", handleRedirect);
    }
  </script>
  
  </html>
